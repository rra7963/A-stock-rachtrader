name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Run test suite from the lockfile
        run: uv run --frozen pytest -q

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Fresh install and import
        run: |
          python -m pip install --upgrade pip
          pip install .
          python -c "import tradingagents, tradingagents.api.app, cli.main; print('clean-install import OK')"

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Lint the repository
        run: uv run --frozen ruff check .

  deployment-contract:
    name: deployment contract and image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Validate tracked deployment contract
        run: |
          python scripts/validate_deploy_contract.py
          uv run --frozen pytest -q tests/test_deploy_contract.py tests/test_deploy_scripts.py
      - name: Validate shell scripts
        run: |
          bash -n scripts/read-deploy-baseline.sh scripts/launch-acr-deploy.sh \
            scripts/deploy-acr-background.sh scripts/wait-acr-deploy-result.sh
          shellcheck scripts/read-deploy-baseline.sh scripts/launch-acr-deploy.sh \
            scripts/deploy-acr-background.sh scripts/wait-acr-deploy-result.sh
      - name: Validate GitHub Actions syntax
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_LINUX_AMD64_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_AMD64_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: Validate Compose models
        run: |
          : > .env
          printf 'TRADINGAGENTS_API_BEARER_TOKEN=%064d\n' 0 > .event-plan-api.env
          printf 'AGENT_RUNTIME_BASE_URL=http://agent-runtime.test:18001\nINTERNAL_AGENT_TOKEN=test-token\n' > "$RUNNER_TEMP/agent-runtime.env"
          docker compose -f docker-compose.yml config --quiet
          TRADINGAGENTS_IMAGE=example.invalid/a-stock-rachtrader:test \
          TRADINGAGENTS_ENV_FILE="$PWD/.env" \
          TRADINGAGENTS_API_ENV_FILE="$PWD/.event-plan-api.env" \
          AGENT_RUNTIME_ENV_FILE="$RUNNER_TEMP/agent-runtime.env" \
          GIT_SHA=0000000000000000000000000000000000000000 \
            docker compose -f docker-compose.server.yml config --quiet
      - name: Build the production image
        run: |
          docker build --tag a-stock-rachtrader:ci .
          test "$(docker image inspect --format '{{.Config.User}}' a-stock-rachtrader:ci)" = "appuser"
          docker run --rm --entrypoint python a-stock-rachtrader:ci \
            -c "import tradingagents; import tradingagents.api.app; import tradingagents.integrations; import cli.main"
          docker run --rm a-stock-rachtrader:ci --help >/dev/null
          docker run --rm --entrypoint tradingagents-dynamic-agent-example \
            a-stock-rachtrader:ci --help >/dev/null

  ci-gate:
    name: CI Gate
    if: always()
    needs: [test, smoke-install, lint, deployment-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.smoke-install.result }}" = "success"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.deployment-contract.result }}" = "success"
